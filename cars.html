<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Neo's Car Rentals Cars">
    <title>Neo's Car Rentals Cars</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>

    <header class="site-header">
        <h1><a href="index.html">Neo's Car Rentals</a></h1>

        <button class="menu-toggle" type="button" onclick="toggleMenu()" aria-label="Toggle menu">
            <i class="fa fa-bars"></i>
        </button>

        <nav id="navMenu" class="nav-links">
            <a href="index.html"><i class="fa fa-home"></i> Home</a>
            <a href="cars.html"><i class="fa fa-car"></i> Cars</a>
            <a href="testimonials.html"><i class="fa fa-comments"></i> Testimonials</a>
            <a href="about.html"><i class="fa fa-info-circle"></i> About</a>
            <a href="contact.html"><i class="fa fa-envelope"></i> Contact</a>
        </nav>
    </header>

    <main>
        <section class="featured">
            <h2>Available Cars</h2>
            <div id="car-list" class="car-container"></div>
        </section>
    </main>

    <dialog id="rental-dialog" aria-labelledby="rental-title">
        <h2 id="rental-title">Confirm Your Rental</h2>
        <p>Car type: <span id="rental-type"></span></p>
        <p>Start date: <span id="rental-start"></span></p>
        <p>Return date: <span id="rental-return"></span></p>
        <div class="dialog-actions">
            <button type="button" id="confirm-rental" class="button">Confirm</button>
            <button type="button" id="cancel-rental" class="button">Cancel</button>
        </div>
    </dialog>

    <script src="script.js"></script>
    <script src="main.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", listCars);

        const rentalDialog = document.getElementById("rental-dialog");
        let rentalInfo = null;

        document.addEventListener("confirm-rental", function (event) {
            rentalInfo = event.detail;

            document.getElementById("rental-type").textContent = rentalInfo.carType;
            document.getElementById("rental-start").textContent = rentalInfo.startDate || "Not selected";
            document.getElementById("rental-return").textContent = rentalInfo.returnDate || "Not selected";

            rentalDialog.showModal();
        });

        document.getElementById("confirm-rental").addEventListener("click", function () {
            rentalDialog.close();
            console.log("Rental confirmed:", rentalInfo);
        });

        document.getElementById("cancel-rental").addEventListener("click", function () {
            rentalDialog.close();
        });
    </script>
</body>
</html>
